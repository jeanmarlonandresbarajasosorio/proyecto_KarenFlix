<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PelisApp – Inicio</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e5e7eb;
      --danger: #ef4444;
      --shadow: 0 10px 25px rgba(0,0,0,.35);
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin:0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--card);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin:0; }
    nav a {
      color: var(--accent);
      margin-left: 1rem;
      text-decoration: none;
    }
    main { flex:1; padding: 1.5rem; }
    .welcome { text-align:center; margin-bottom:2rem; }
    .gallery {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
      gap: 1rem;
    }
    .gallery img {
      width:100%;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      object-fit: cover;
      transition: transform .15s ease;
    }
    .gallery img:hover { transform: translateY(-2px) scale(1.02); }
  </style>
</head>
<body>
  <header>

  </header>

  <main>
    <section class="welcome">
      <h2>Bienvenido a PelisApp</h2>
      <p>Explora las mejores películas y series desde una sola plataforma</p>
    </section>

    <section class="gallery">
      <!-- The Godfather -->
       <img src="https://image.tmdb.org/t/p/w500/saHP97rTPS5eLmrLQEcANmKrsFl.jpg" 
     alt="Forrest Gump" 
     loading="lazy" 
     onerror="this.onerror=null;this.src='https://via.placeholder.com/300x450?text=Forrest+Gump';">

       <img src="https://image.tmdb.org/t/p/w500/6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg" alt="Pulp Fiction" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x450?text=Pulp+Fiction';">
       <img src="https://image.tmdb.org/t/p/w500/uzERcfV2rSHNhW5eViQiO9hNiA7.jpg" alt="The Lion King" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x450?text=Lion+King';">
       <img src="https://image.tmdb.org/t/p/w500/q719jXXEzOoYaps6babgKnONONX.jpg" alt="Spirited Away" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x450?text=Spirited+Away';">
       <img src="https://image.tmdb.org/t/p/w500/kGzFbGhp99zva6oZODW5atUtnqi.jpg" alt="Goodfellas" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x450?text=Goodfellas';">
       <img src="https://image.tmdb.org/t/p/w500/rSPw7tgCH9c6NqICZef4kZjFOQ5.jpg" alt="The Godfather" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/300x450?text=Godfather';">
<img loading="lazy" src="https://image.tmdb.org/t/p/w500/3bhkrj58Vtu7enYsRolD1fZdja1.jpg" alt="The Godfather (1972)" onerror="imgFallback(this, 'The Godfather')">
      <!-- The Shawshank Redemption -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg" alt="The Shawshank Redemption (1994)" onerror="imgFallback(this, 'Shawshank Redemption')">
      <!-- The Dark Knight -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg" alt="The Dark Knight (2008)" onerror="imgFallback(this, 'The Dark Knight')">
      <!-- Pulp Fiction -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/d5iIlFn5s0ImszYzBPb8JPIfbXD.jpg" alt="Pulp Fiction (1994)" onerror="imgFallback(this, 'Pulp Fiction')">
      <!-- Forrest Gump -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/saHP97rTPS5eLmrLQEcANmKrsFl.jpg" alt="Forrest Gump (1994)" onerror="imgFallback(this, 'Forrest Gump')">
      <!-- Inception -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg" alt="Inception (2010)" onerror="imgFallback(this, 'Inception')">
      <!-- Interstellar -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" alt="Interstellar (2014)" onerror="imgFallback(this, 'Interstellar')">
      <!-- The Matrix -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg" alt="The Matrix (1999)" onerror="imgFallback(this, 'The Matrix')">
      <!-- Fight Club -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/a26cQPRhJPX6GbWfQbvZdrrp9j9.jpg" alt="Fight Club (1999)" onerror="imgFallback(this, 'Fight Club')">
      <!-- The Lord of the Rings: The Fellowship of the Ring -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg" alt="The Lord of the Rings: The Fellowship of the Ring (2001)" onerror="imgFallback(this, 'LOTR Fellowship')">
      <!-- Star Wars: A New Hope -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/6FfCtAuVAW8XJjZ7eWeLibRLWTw.jpg" alt="Star Wars: A New Hope (1977)" onerror="imgFallback(this, 'Star Wars')">
      <!-- The Avengers (2012) -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/RYMX2wcKCBAr24UyPD7xwmjaTn.jpg" alt="Marvel's The Avengers (2012)" onerror="imgFallback(this, 'The Avengers')">
      <!-- Titanic (1997) -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg" alt="Titanic (1997)" onerror="imgFallback(this, 'Titanic')">
      <!-- Spirited Away (2001) -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/39wmItIWsg5sZMyRUHLkWBcuVCM.jpg" alt="Spirited Away (2001)" onerror="imgFallback(this, 'Spirited Away')">
      <!-- Parasite (2019) -->
      <img loading="lazy" src="https://image.tmdb.org/t/p/w500/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg" alt="Parasite (2019)" onerror="imgFallback(this, 'Parasite')">
    </section>
  </main>

  <script>
    function imgFallback(img, title) {
      img.onerror = null;
      img.src = `https://via.placeholder.com/500x750?text=${encodeURIComponent(title)}`;
    }
  </script>
</body>
</html>
