<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PelisApp - Catálogo de Películas</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e5e7eb;
      --shadow: 0 10px 25px rgba(0,0,0,.35);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--card);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    header h1 { margin:0; }
    nav a {
      color: var(--accent);
      margin-left: 1rem;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover { color: var(--accent-hover); }
    main {
      flex:1;
      padding: 2rem;
    }
    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--accent);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }
    .gallery img {
      width: 100%;
      height: 280px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      object-fit: cover;
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    footer {
      background: var(--card);
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>

    </nav>
  </header>
  </style>
