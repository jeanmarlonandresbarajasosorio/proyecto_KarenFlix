<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PelisApp - Catálogo de Películas</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #e5e7eb;
      --shadow: 0 10px 25px rgba(0,0,0,.35);
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: var(--card);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    header h1 { margin:0; }
    nav a {
      color: var(--accent);
      margin-left: 1rem;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover { color: var(--accent-hover); }
    main {
      flex:1;
      padding: 2rem;
    }
    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--accent);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }
    .gallery img {
      width: 100%;
      height: 280px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      object-fit: cover;
      transition: transform 0.3s;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
    footer {
      background: var(--card);
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1> PelisApp</h1>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="movies.html">Películas</a>
      <a href="series.html">Series</a>
      <a href="anime.html">Anime</a>
      <a href="login.html">Login</a>
    </nav>
  </header>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #111827;
      color: #f3f4f6;
      display: flex;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background-color: #1f2937;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      padding: 20px;
    }
    .sidebar h2 {
      color: #3b82f6;
      margin-bottom: 30px;
      text-align: center;
    }
    .sidebar a {
      display: block;
      color: #f3f4f6;
      text-decoration: none;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .sidebar a:hover {
      background-color: #374151;
    }

    /* Main */
    .main {
      margin-left: 240px;
      padding: 20px;
      flex: 1;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header h1 {
      margin: 0;
      color: #3b82f6;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background-color: #1f2937;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.6);
    }
    .card h3 {
      margin: 0;
      font-size: 18px;
      color: #9ca3af;
    }
    .card p {
      font-size: 24px;
      margin-top: 10px;
      color: #3b82f6;
    }

    /* Forms */
    .form-section {
      background-color: #1f2937;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }
    .form-section h2 {
      margin-top: 0;
      color: #3b82f6;
    }
    form label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    form input, form textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
    }
    form button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    form button:hover {
      background-color: #2563eb;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    table th, table td {
      border: 1px solid #374151;
      padding: 12px;
      text-align: left;
    }
    table th {
      background-color: #1f2937;
      color: #3b82f6;
    }
    table td button {
      padding: 5px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .edit {
      background-color: #10b981;
      color: white;
    }
    .delete {
      background-color: #ef4444;
      color: white;
      margin-left: 5px;
    }

    /* Messages */
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }
    .success {
      background-color: #065f46;
      color: #d1fae5;
    }
    .error {
      background-color: #7f1d1d;
      color: #fee2e2;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Admin Panel</h2>
   <nav>
      <a href="index.html">Inicio</a>
      <a href="movies.html">Películas</a>
      <a href="series.html">Series</a>
      <a href="anime.html">Anime</a>
      <a href="login.html">Login</a>
    </nav>
  </div>

  <div class="main">
    <div class="header">
      <h1>Admin Panel</h1>
      <button onclick="logout()" style="background:#ef4444; border:none; padding:10px 20px; border-radius:8px; color:white; cursor:pointer;">Cerrar sesión</button>
    </div>

    <!-- Tarjetas de estadísticas -->
    <div class="stats">
      <div class="card">
        <h3>Películas</h3>
        <p id="countMovies">50</p>
      </div>
      <div class="card">
        <h3>Series</h3>
        <p id="countSeries">30</p>
      </div>
      <div class="card">
        <h3>Usuarios</h3>
        <p id="countUsers">120</p>
      </div>
    </div>

    <!-- Formulario para agregar películas -->
    <div class="form-section">
      <h2>Agregar Película</h2>
      <form id="movieForm">
        <label>Título</label>
        <input type="text" id="title" required>
        <label>Descripción</label>
        <textarea id="description" required></textarea>
        <label>URL Imagen</label>
        <input type="url" id="image" required>
        <button type="submit">Guardar</button>
      </form>
      <div id="message" class="message"></div>
    </div>

    <!-- Tabla de películas -->
    <h2>Listado de Películas</h2>
    <table id="movieTable">
      <thead>
        <tr>
          <th>Título</th>
          <th>Descripción</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Datos dinámicos -->
      </tbody>
    </table>
  </div>

 <script>
    const movieForm = document.getElementById("movieForm");
    const movieTable = document.getElementById("movieTable").querySelector("tbody");
    const message = document.getElementById("message");

    let editingRow = null;

    // Agregar o actualizar película
    movieForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("title").value;
      const description = document.getElementById("description").value;
      const image = document.getElementById("image").value;

      if (title && description && image) {
        if (editingRow) {
          editingRow.cells[0].textContent = title;
          editingRow.cells[1].textContent = description;
          editingRow.cells[2].innerHTML = `<img src="${image}" width="60">`;
          message.textContent = "Película editada correctamente ✅";
          message.className = "message success";
          message.style.display = "block";
          editingRow = null;
        } else {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${title}</td>
            <td>${description}</td>
            <td><img src="${image}" width="60"></td>
            <td>
              <button class="edit">Editar</button>
              <button class="delete">Eliminar</button>
            </td>
          `;
          movieTable.appendChild(row);
          message.textContent = "Película agregada correctamente ✅";
          message.className = "message success";
          message.style.display = "block";
        }
        movieForm.reset();
      } else {
        message.textContent = "⚠️ Por favor completa todos los campos.";
        message.className = "message error";
        message.style.display = "block";
      }
    });

    // Delegación de eventos editar/eliminar
    movieTable.addEventListener("click", (e) => {
      if (e.target.classList.contains("delete")) {
        if (confirm("¿Seguro que deseas eliminar esta película?")) {
          e.target.closest("tr").remove();
          message.textContent = "Película eliminada ❌";
          message.className = "message success";
          message.style.display = "block";
        }
      }

      if (e.target.classList.contains("edit")) {
        const row = e.target.closest("tr");
        document.getElementById("title").value = row.cells[0].textContent;
        document.getElementById("description").value = row.cells[1].textContent;
        document.getElementById("image").value = row.cells[2].querySelector("img").src;
        editingRow = row;
        message.textContent = "Editando película... ✏️";
        message.className = "message success";
        message.style.display = "block";
      }
    });

    // Logout
    function logout() {
      if (confirm("¿Desea cerrar la sesión?")) {
        window.location.href = "login.html";
      }
    }
  </script>
</body>
 </html>
